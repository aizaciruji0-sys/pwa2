<!doctype html>
<html lang="id">
<meta charset=utf-8>
<meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name=theme-color content="#111">
<title>db</title>
<link rel=manifest href="manifest.json">
<link rel=icon href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='20' fill='%23111'/><text x='50' y='68' font-size='56' fill='%23fff' text-anchor='middle' font-family='system-ui'>db</text></svg>">

<header>
<input id=q placeholder=filter>
<select id=so></select>
<button data-a=add>+</button>
<button data-a=imp>impor</button>
<button data-a=csv>csv</button>
<button data-a=tsv>tsv</button>
<button data-a=txt>txt</button>
<button data-a=gas>gas</button>
<button data-a=gsheets>gsheets</button>
<button data-a=sheet>sheet</button>
<button data-a=sync>sync</button>
<button data-a=schema>schema</button>
<button data-a=wipe>wipe</button>
<span id=msg></span>
</header>

<main id=m></main>

<footer>
<div id=fb></div>
</footer>

<input id=f type=file accept=".csv,.tsv,.txt" hidden>

<script>
'use strict';

const K = ['idproduk','subkategori','kategori','namaproduk','hargabeli','hargajual','foto_url'];
const S = {data:[], cur:null, fill:null, page:1, u:'', i:'', msg:'', form:null, pend:null};
const $ = id => document.getElementById(id);
const M = $('m'), FB = $('fb'), SO = $('so'), Q = $('q'), F = $('f');

const SEQ = [[-1,0],[-2,0]];
K.forEach((k,i) => SEQ.push([i,1],[i,-1]));

try {
  S.data = JSON.parse(localStorage.D || '[]').map(r => Array.isArray(r) ? r : String(r).split('|'));
  S.u = localStorage.U || '';
  S.i = localStorage.V || '';
  if (localStorage.K) {
    K.length = 0;
    localStorage.K.split(',').forEach(x => K.push(x));
    SEQ.length = 0;
    SEQ.push([-1,0],[-2,0]);
    K.forEach((k,i) => SEQ.push([i,1],[i,-1]));
  }
} catch(_){}

const nextId = () => {
  const d = new Date();
  const t = String(d.getHours()).padStart(2,'0') + String(d.getMinutes()).padStart(2,'0');
  const u = new Set(S.data.map(r => r[0]));
  let id;
  do { id = t + Math.random().toString(36).slice(2,5); } while (u.has(id));
  return id;
};

const inputs = () => Array.from(M.querySelectorAll('input'), x => x.value);

const view = () => {
  const q = Q.value.toLowerCase().split(/\s+/).filter(Boolean);
  let v = S.data.map((_,i) => i);
  if (q.length) v = v.filter(i => q.every(t => S.data[i].join(' ').toLowerCase().includes(t)));
  const [c, d] = SEQ[+SO.value];
  if (c === -2) v.reverse();
  else if (c >= 0) v.sort((a,b) => String(S.data[a][c]).localeCompare(String(S.data[b][c])) * d);
  return v;
};

const btn = (t, f) => {
  const b = document.createElement('button');
  b.textContent = t;
  b.dataset.f = f;
  return b;
};

function render() {
  const v = view();
  const end = Math.min(S.page * 20, v.length);
  M.innerHTML = FB.innerHTML = '';

  if (S.form === 'sheet') {
    [['url', S.u], ['id', S.i]].forEach(([k, val]) => {
      const l = document.createElement('label');
      l.textContent = k + ' ';
      const inp = document.createElement('input');
      inp.value = val;
      l.appendChild(inp);
      M.appendChild(l);
      M.appendChild(document.createElement('br'));
    });
    ['save','cancel'].forEach(f => FB.appendChild(btn(f, f)));
  } else if (S.form === 'schema') {
    const l = document.createElement('label');
    l.textContent = 'kolom (pisah koma) ';
    const inp = document.createElement('input');
    inp.value = K.join(',');
    l.appendChild(inp);
    M.appendChild(l);
    ['save','cancel'].forEach(f => FB.appendChild(btn(f, f)));
  } else if (S.cur === null) {
    if (!end) M.textContent = 'kosong';
    else v.slice(0, end).forEach(i => {
      const r = document.createElement('div');
      r.dataset.i = i;
      r.textContent = S.data[i].join(' ');
      M.appendChild(r);
    });
    if (end < v.length) FB.appendChild(btn('more', 'more'));
  } else {
    const src = S.cur < 0 ? S.fill : S.data[S.cur];
    K.forEach((k,i) => {
      const l = document.createElement('label');
      l.textContent = k + ' ';
      const inp = document.createElement('input');
      inp.value = src[i] || '';
      l.appendChild(inp);
      M.appendChild(l);
      M.appendChild(document.createElement('br'));
    });
    const ins = M.querySelectorAll('input');
    if (ins.length) (ins[3] || ins[0]).focus();
    ['save','cancel','dup','del'].forEach(f => FB.appendChild(btn(f, f)));
  }

  $('msg').textContent = S.msg;

  localStorage.D = JSON.stringify(S.data);
}

async function push() {
  if (!S.u || !S.i) return;
  try {
    await fetch(S.u, {
      method: 'POST',
      body: JSON.stringify({sid: S.i, lines: S.data.map(r => r.join('|'))}),
      headers: {'Content-Type': 'text/plain'}
    });
  } catch(_){}
}

async function pull() {
  if (!S.u || !S.i) return;
  try {
    const r = await fetch(S.u + '?action=pull&sid=' + S.i);
    const j = await r.json();
    if (j.ok && j.lines) {
      S.data = j.lines.map(l => l.split('|'));
      render();
    }
  } catch(_){}
}

function rebuildSort() {
  SO.innerHTML = '';
  SEQ.forEach(([c, d], i) => {
    const o = document.createElement('option');
    o.value = i;
    o.textContent = c < 0 ? (c === -1 ? 'sort' : 'rev') : K[c] + (d > 0 ? '+' : '-');
    SO.appendChild(o);
  });
  SO.value = 0;
}

function act(key) {
  if (key === 'del') {
    if (S.pend !== 'del') { S.pend = 'del'; S.msg = 'klik lagi utk hapus'; render(); return; }
    S.pend = null; S.msg = '';
    if (S.cur >= 0) S.data.splice(S.cur, 1);
    S.cur = null;
    render(); push(); return;
  }
  if (key === 'wipe') {
    if (S.pend !== 'wipe') { S.pend = 'wipe'; S.msg = 'klik lagi utk wipe'; render(); return; }
    S.pend = null; S.msg = '';
    S.data = [];
    render(); push(); return;
  }

  S.msg = ''; S.pend = null;

  if (key === 'gas') {
    window.open(
      S.u ? 'https://script.google.com/home' : 'https://script.google.com/home/projects/create',
      '_blank'
    );
    return;
  }
  if (key === 'gsheets') {
    window.open(
      S.i
        ? 'https://docs.google.com/spreadsheets/d/' + S.i + '/edit'
        : 'https://docs.google.com/spreadsheets/create',
      '_blank'
    );
    return;
  }
  if (key === 'sync') {
    if (!S.u || !S.i) { S.msg = 'setup sheet dulu'; render(); return; }
    push().then(pull);
    return;
  }
  if (key === 'schema') { S.form = 'schema'; S.cur = null; render(); return; }
  if (key === 'sheet')  { S.form = 'sheet';  S.cur = null; render(); return; }
  if (key === 'add') { S.form = null; S.cur = -1; S.fill = [nextId()]; }
  else if (key === 'dup') {
    const p = (S.cur >= 0 ? S.data[S.cur] : inputs()).slice();
    p[0] = nextId();
    S.fill = p;
    S.cur = -1;
  }
  else if (key === 'save') {
    if (S.form === 'sheet') {
      const ins = M.querySelectorAll('input');
      S.u = ins[0].value;
      S.i = (ins[1].value.match(/\/d\/([\w-]{10,})/) || [])[1] || ins[1].value;
      localStorage.U = S.u;
      localStorage.V = S.i;
      S.form = null;
      render(); push(); return;
    }
    if (S.form === 'schema') {
      const arr = M.querySelector('input').value.split(',').map(s => s.trim()).filter(Boolean);
      if (arr.length) {
        K.length = 0;
        arr.forEach(x => K.push(x));
        SEQ.length = 0;
        SEQ.push([-1,0],[-2,0]);
        K.forEach((k,i) => SEQ.push([i,1],[i,-1]));
        localStorage.K = K.join(',');
        rebuildSort();
      }
      S.form = null;
      render(); return;
    }
    const p = inputs();
    if (!p[0]) p[0] = nextId();
    if (p.slice(1).some(x => x)) {
      if (S.cur < 0) S.data.push(p);
      else S.data[S.cur] = p;
    } else if (S.cur >= 0) S.data.splice(S.cur, 1);
    S.cur = null;
  }
  else if (key === 'cancel') { S.cur = null; S.form = null; }
  else if (key === 'imp') return F.click();
  else if (key === 'more') S.page++;
  else if (key === 'csv' || key === 'tsv' || key === 'txt') {
    const a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob([view().map(i => S.data[i].join('|')).join('\n')]));
    a.download = 'db.' + key;
    a.click();
    return;
  }
  render();
  push();
}

document.onclick = e => {
  const b = e.target.closest('button');
  if (b) return act(b.dataset.a || b.dataset.f);
  if (S.cur !== null || S.form) return;
  const r = e.target.closest('div[data-i]');
  if (r) { S.cur = +r.dataset.i; render(); }
};

F.onchange = async () => {
  if (!F.files[0]) return;
  S.data = (await F.files[0].text()).split(/\r?\n/).filter(l => l.trim()).map(l => l.split('|'));
  F.value = '';
  S.page = 1;
  render();
  push();
};

Q.oninput = () => { S.page = 1; render(); };
SO.onchange = () => { localStorage.I = SO.value; S.page = 1; render(); };

rebuildSort();
render();
pull();

if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
</script>
</html>
